[mypy]
# 忽略因找不到模組型別存根 (stubs) 而產生的匯入錯誤
ignore_missing_imports = True
# 允許變數在同一範圍內被重新定義為不同型別
allow_redefinition = True
# 啟用增量模式
incremental = True
# 當 Mypy 本身崩潰時，顯示詳細的錯誤追蹤訊息
show_traceback = True
# 在整個專案中停用 arg-type 檢查
disable_error_code = arg-type
# 排除測試與 log 目錄
exclude = ^(tests/|logs/)

# --- Pre-existing third-party stub friction / legacy warts, scoped per module. ---
# Tracked tech debt: do NOT extend these sections for new code.

# RLlib PPOConfig.training() accepts PPO-specific kwargs the AlgorithmConfig stub omits.
[mypy-training.hardness_ppo]
disable_error_code = call-arg

[mypy-training.eehemt_ppo]
disable_error_code = call-arg

[mypy-training.ppo_common]
disable_error_code = call-arg

# ray.tune ResultGrid is iterable at runtime; stub lacks __iter__.
[mypy-train_ppo]
disable_error_code = attr-defined

# gymnasium Space[Any] vs Box narrowing for .low/.high access.
[mypy-env.eehemt_env]
disable_error_code = attr-defined

[mypy-env.parameter_flow]
disable_error_code = call-overload

[mypy-env.load_data]
disable_error_code = misc
