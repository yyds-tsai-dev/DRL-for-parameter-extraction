[project]
name = "drl-on-parameter-extraction"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "gymnasium[accept-rom-license,atari,mujoco]>=1.0.0",
    "ipywidgets>=8.1.7",
    "joblib>=1.5.1",
    "matplotlib>=3.10.5",
    "numpy>=2.3.2",
    "openpyxl>=3.1.5",
    "pandas>=2.3.1",
    "pandas-stubs>=2.3.0.250703",
    "python-dotenv>=1.1.1",
    "ray[rllib]>=2.48.0",
    "scikit-learn>=1.7.1",
    "scipy>=1.16.1",
    "torch>=2.7.1",
    "verilogae>=1.0.0",
    "wandb>=0.21.1",
    "xgboost>=3.0.2",
]

[project.optional-dependencies]
keras-inference = [
    "tensorflow>=2.19.0",
]

[dependency-groups]
dev = [
    "jupyterlab>=4.4.5",
    "mypy>=2.3.0",
    "pytest>=8.4.1",
    "ruff>=0.15.22",
]

[tool.ruff]

[tool.ruff.lint]
extend-select = ["PTH"]
ignore = ["PTH"]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E402"]
"scripts/run_model_inference.py" = ["E402"]
